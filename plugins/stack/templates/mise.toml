[tools]
bun = "latest"
# Biome・tsc の起動スクリプト (node_modules/.bin) は node で動く
node = "latest"
uv = "latest"
lefthook = "latest"
# Stop の hook が、シークレット (gitleaks) と、依存の脆弱性・IaC の設定ミス (trivy) を確かめる
gitleaks = "latest"
trivy = "latest"

[settings]
experimental = true
# mise.lock に版とダウンロードの URL を残す。Claude Code on the web は lock の URL からツールを入れる
lockfile = true

[hooks]
postinstall = "lefthook install"
