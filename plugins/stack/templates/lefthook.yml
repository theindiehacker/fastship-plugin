# コミットする前に、ステージしたファイルの lint・整形・型チェックを行う。
# パッケージの dir (package.json・pyproject.toml のある dir) ごとにジョブを分け、root にその dir を書く
pre-commit:
  jobs:
    - name: biome
      root: frontend/
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    - name: tsc
      root: frontend/
      glob: "*.{ts,tsx,mts,cts}"
      run: bunx tsc --noEmit
    - name: ruff
      root: backend/
      glob: "*.{py,pyi}"
      run: uv run ruff check --force-exclude {staged_files} && uv run ruff format --check --force-exclude {staged_files}
    - name: pyright
      root: backend/
      glob: "*.{py,pyi}"
      run: uv run pyright {staged_files}
